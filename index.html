<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphic Designer | Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d110e;
      color: #ffffff;
      padding: 0;
      margin: 0;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 60px;
      background-color: #0d110e;
      border-bottom: 1px solid #1a221d;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 500;
      color: #e0e0e0;
      letter-spacing: -0.2px;
    }
    .nav-links {
      display: flex;
      gap: 32px;
      font-size: 0.95rem;
    }
    .nav-links a {
      color: #a0a0a0;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a.active,
    .nav-links a:hover {
      color: #20e070;
      font-weight: 600;
      border-bottom: 2px solid #20e070;
      padding-bottom: 4px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px;
    }

    .page-title {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -1.5px;
      margin-bottom: 50px;
      color: #ffffff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .folder-card {
      background-color: #141b16;
      border: 1px solid #1f2a23;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .folder-card:hover {
      transform: translateY(-4px);
      border-color: #20e070;
    }

    .card-img-wrap {
      width: 100%;
      height: 260px;
      overflow: hidden;
      background-color: #0a0d0b;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-footer {
      padding: 20px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
    }
    .badge {
      background-color: #20e070;
      color: #0d110e;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      text-transform: capitalize;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .top-nav { padding: 20px 24px; }
      .container { padding: 40px 24px; }
      .page-title { font-size: 2.5rem; }
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="brand-title">Your Name > Graphic Designer Portfolio</div>
    <nav class="nav-links">
      <a href="#">Work</a>
      <a href="#" class="active">Available</a>
      <a href="#">About</a>
    </nav>
  </header>

  <!-- Main Content Grid -->
  <main class="container">
    <h1 class="page-title">Available work</h1>

    <div class="grid">

      <!-- Folder 1 -->
      <a href="#" class="folder-card">
        <div class="card-img-wrap">
          <img src="img1.jpg" alt="Brand Identity & CMYK">
        </div>
        <div class="card-footer">
          <span class="card-title">Brand Identity & CMYK</span>
          <span class="badge">Available</span>
        </div>
      </a>

      <!-- Folder 2 -->
      <a href="#" class="folder-card">
        <div class="card-img-wrap">
          <img src="img2.jpg" alt="Print Media & Prepress">
        </div>
        <div class="card-footer">
          <span class="card-title">Print Media & Prepress</span>
          <span class="badge">Available</span>
        </div>
      </a>

      <!-- Folder 3 -->
      <a href="#" class="folder-card">
        <div class="card-img-wrap">
          <img src="img3.jpg" alt="Digital Marketing">
        </div>
        <div class="card-footer">
          <span class="card-title">Digital Marketing</span>
          <span class="badge">Available</span>
        </div>
      </a>

      <!-- Folder 4 -->
      <a href="#" class="folder-card">
        <div class="card-img-wrap">
          <img src="img4.jpg" alt="Packaging & Dielines">
        </div>
        <div class="card-footer">
          <span class="card-title">Packaging & Dielines</span>
          <span class="badge">Available</span>
        </div>
      </a>

      <!-- Folder 5 -->
      <a href="#" class="folder-card">
        <div class="card-img-wrap">
          <img src="img5.jpg" alt="Large Format & Signage">
        </div>
        <div class="card-footer">
          <span class="card-title">Large Format & Signage</span>
          <span class="badge">Available</span>
        </div>
      </a>

      <!-- Folder 6 -->
      <a href="#" class="folder-card">
        <div class="card-img-wrap">
          <img src="img6.jpg" alt="Social Media Assets">
        </div>
        <div class="card-footer">
          <span class="card-title">Social Media Assets</span>
          <span class="badge">Available</span>
        </div>
      </a>

    </div>
  </main>

</body>
</html>
